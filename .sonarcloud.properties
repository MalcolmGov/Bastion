# SonarQube Cloud analyses this repository with automatic analysis, which reads this file (not sonar-project.properties).
# Only the properties set here are overridden; everything else keeps the project's existing analysis scope.
#
# scripts/ is throwaway capture, screenshot and E2E tooling, much of it copy-pasted between sibling scripts (some pairs share
# 30-50 identical lines). It is still analysed for issues; only the duplication measure skips it, so a one-line edit inside one of
# those scripts is not counted as new duplicated code.
sonar.cpd.exclusions=scripts/**
