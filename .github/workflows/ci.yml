name: Bastion Move Studio Production CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Production Gates & Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: 1
      CRON_SECRET: sec_bastion_ci_cron_token_2026
      API_SECRET_TOKEN: sec_bastion_ci_api_token_2026
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Production & Dev Dependencies
        run: npm ci

      - name: Run Gates 1 & 2 Automated Security Verification Suite
        run: npx tsx scripts/verify-production-gates.ts

      - name: Verify Next.js Production Build
        run: npm run build
