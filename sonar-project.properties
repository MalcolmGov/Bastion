sonar.projectKey=MalcolmGov_Bastion
sonar.organization=malcolmgov
sonar.sources=src
sonar.tests=tests,scripts
sonar.test.inclusions=tests/**,scripts/**
sonar.exclusions=node_modules/**,.next/**,fixtures/**,public/**
# The scripts/ folder is throwaway capture, screenshot and E2E tooling, much of it copy-pasted from sibling scripts. It is still analysed
# for issues; only the duplication measure skips it, so editing one of those scripts is not counted as new duplicated code.
sonar.cpd.exclusions=scripts/**
